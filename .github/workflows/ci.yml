name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          # MinVer needs the tags and history to compute the version
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore DriveMigrator.slnx

      - name: Build
        run: dotnet build DriveMigrator.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test DriveMigrator.slnx --configuration Release --no-build --logger "trx;LogFilePrefix=${{ matrix.os }}"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: "**/TestResults/*.trx"
