name: drive-migrator
base: core24
# summary, description and the desktop file come from the AppStream metainfo; version and grade
# come from the git tags through MinVer, computed by the drive-migrator part
adopt-info: desktop-integration

# overridden with stable when building a tagged release
grade: devel
confinement: strict

platforms:
  amd64:
      build-on: [amd64]
      build-for: [amd64]
  arm64:
      build-on: [arm64]
      build-for: [arm64]

parts:
  drive-migrator:
    plugin: dotnet
    source: .
    dotnet-version: '10.0'
    dotnet-project: src/DriveMigrator.App/DriveMigrator.App.csproj
    dotnet-verbosity: minimal
    # MinVer shells out to git; building without the repository's history is an error rather
    # than a silent 0.0.0-alpha.0
    build-packages: [git]
    override-build: |
      craftctl default
      project=src/DriveMigrator.App/DriveMigrator.App.csproj
      version="$(dotnet msbuild "$project" -nologo -t:MinVer -getProperty:MinVerVersion \
        -warnaserror:MINVER1001)"
      prefix="$(dotnet msbuild "$project" -nologo -getProperty:MinVerTagPrefix)"
      # a tagged release is a commit carrying the tag MinVer took the version from
      if git tag --points-at HEAD | grep -qxF "$prefix$version"; then grade=stable; else grade=devel; fi
      mkdir "$CRAFT_PART_INSTALL/snap-metadata"
      echo "$version" > "$CRAFT_PART_INSTALL/snap-metadata/version"
      echo "$grade" > "$CRAFT_PART_INSTALL/snap-metadata/grade"
    organize:
      '*': opt/drive-migrator/
    prime:
      - -opt/drive-migrator/snap-metadata

  desktop-integration:
    plugin: dump
    source: packaging/linux
    after: [drive-migrator]
    override-build: |
      craftctl default
      version="$(cat "$CRAFT_STAGE/opt/drive-migrator/snap-metadata/version")"
      grade="$(cat "$CRAFT_STAGE/opt/drive-migrator/snap-metadata/grade")"
      test -n "$version"
      craftctl set version="$version"
      craftctl set grade="$grade"
    organize:
      tech.mateus.DriveMigrator.desktop: usr/share/applications/tech.mateus.DriveMigrator.desktop
      tech.mateus.DriveMigrator.metainfo.xml: usr/share/metainfo/tech.mateus.DriveMigrator.metainfo.xml
      tech.mateus.DriveMigrator.svg: usr/share/icons/hicolor/scalable/apps/tech.mateus.DriveMigrator.svg
    parse-info: [usr/share/metainfo/tech.mateus.DriveMigrator.metainfo.xml]

apps:
  drive-migrator:
    command: opt/drive-migrator/DriveMigrator
    common-id: tech.mateus.DriveMigrator
    # gnome provides fontconfig, freetype, X11 and libsecret for SkiaSharp, Avalonia and the keyring
    extensions: [ gnome, dotnet10 ]
    environment:
      DRIVEMIGRATOR_DATA_DIR: $SNAP_USER_DATA
    plugs:
      - home
      - network
      - network-bind
      - password-manager-service
